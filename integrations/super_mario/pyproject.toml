[project]
name = "microduck-super-mario-sidecar"
version = "0.1.0"
description = "Python 3.13 gym-super-mario-bros sidecar for Microduck"
requires-python = ">=3.13,<3.15"
dependencies = [
    "gym-super-mario-bros==9.1.0",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
microduck-super-mario = "mario_sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mario_sidecar.py"]
